/* FACE CLINIC founder design alignment */
#fc-method{--deep:#06251f;--mint:#64786e;--cream:#c6cec7;--brass:#91813a;--line:rgba(198,206,199,.28);--darkline:rgba(6,37,31,.2);--title:"EB Garamond",Georgia,serif;--body:"PT Sans",Arial,sans-serif;font-family:var(--body);background:var(--deep);color:var(--cream)}
#fc-method h1,#fc-method h2,#fc-method h3,#fc-method blockquote,#fc-method .fc-method-lead{font-family:var(--title)!important;font-weight:400!important}
#fc-method .fc-label,#fc-method .fc-method-button,#fc-method .fc-method-link{font-family:var(--body)!important}
#fc-method .fc-method-hero{height:calc(100svh - 132px);min-height:560px;max-height:820px;grid-template-columns:minmax(0,55%) minmax(0,45%)}
#fc-method .fc-method-hero__copy{padding-top:clamp(52px,7vw,92px)}
#fc-method .fc-method-hero figure{overflow:hidden;background:var(--deep)}
#fc-method .fc-method-hero img{height:100%;min-height:0;object-fit:contain;object-position:center}
#fc-method .fc-method-meta{position:relative;border-top:0;padding-top:16px}
#fc-method .fc-method-meta::before{content:"";position:absolute;top:0;right:0;left:0;height:1px;background:var(--brass)}
#fc-method .fc-method-intro{background:var(--mint);color:var(--cream)}
#fc-method .fc-method-grid h2 em{color:var(--deep)}
#fc-method .fc-method-split{background:var(--deep)}
#fc-method .fc-method-split__image{overflow:hidden}
#fc-method .fc-method-split__image img,#fc-method .fc-method-photo figure img{border-radius:20px;transition:transform .65s cubic-bezier(.22,1,.36,1),filter .45s ease}
#fc-method .fc-method-split__image:hover img,#fc-method .fc-method-photo figure:hover img{filter:saturate(1.04) contrast(1.02);transform:scale(1.035)}
#fc-method .fc-method-list span{color:var(--brass);font-size:clamp(15px,1.15vw,18px);line-height:1;font-variant-numeric:tabular-nums}
#fc-method .fc-method-steps{background:var(--deep);color:var(--cream)}
#fc-method .fc-method-steps .fc-method-head h2 em{color:var(--brass)}
#fc-method .fc-method-steps .fc-method-list li{position:relative}
#fc-method .fc-method-steps .fc-method-list li:not(:last-child)::before{content:"";position:absolute;z-index:0;top:calc(50% + 14px);bottom:calc(-50% + 14px);left:31px;width:1px;background:var(--brass);opacity:.9;pointer-events:none}
#fc-method .fc-method-steps .fc-method-list span{position:relative;z-index:1}
#fc-method .fc-method-photo{background:var(--mint);color:var(--cream)}
#fc-method .fc-method-photo h2 em{color:var(--deep)}
#fc-method .fc-method-cta{background:var(--mint);color:var(--cream)}
#fc-method .fc-method-cta h2 em{color:var(--deep)}
#fc-method .fc-method-button{display:flex;align-items:center;justify-content:center;gap:.6rem;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:linear-gradient(135deg,#a58d36 0%,#806400 100%);box-shadow:0 12px 28px rgba(6,37,31,.22);color:#fff;transition:transform .25s ease,box-shadow .25s ease,filter .25s ease}
#fc-method .fc-method-button::after{content:"";transition:transform .25s ease}
#fc-method .fc-method-button:hover{filter:brightness(1.06);box-shadow:0 16px 34px rgba(6,37,31,.3);transform:translateY(-3px)}
#fc-method .fc-method-button:hover::after{transform:translate(2px,-2px)}
#fc-method .fc-method-button:active{transform:scale(.98)}
#fc-method .fc-method-button:focus-visible,#fc-method .fc-method-link:focus-visible{outline:2px solid #fff;outline-offset:4px}
#fc-method .fc-method-link{transition:color .25s ease,border-color .25s ease,transform .25s ease}
#fc-method .fc-method-link:hover{color:var(--brass);border-color:var(--brass);transform:translateY(-2px)}
#fc-method .fc-reveal{opacity:0;transform:translateY(22px);transition:opacity .75s ease,transform .75s cubic-bezier(.22,1,.36,1);transition-delay:var(--fc-delay,0ms)}
#fc-method .fc-reveal.is-visible{opacity:1;transform:none}
@media(max-width:700px){#fc-method .fc-method-hero{height:auto;min-height:0;max-height:none}#fc-method .fc-method-hero img{height:auto;aspect-ratio:4/3;object-fit:cover}#fc-method .fc-method-steps .fc-method-list li:not(:last-child)::before{left:18px}}
@media(prefers-reduced-motion:reduce){#fc-method .fc-reveal{opacity:1;transform:none;transition:none}#fc-method .fc-method-split__image img,#fc-method .fc-method-photo figure img,#fc-method .fc-method-button{transition:none}}
